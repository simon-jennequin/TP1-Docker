services:
  database:
    build: ./database
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - backend-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./simpleapi
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - backend-network
      - frontend-network
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  front:
    build: ./front
    networks:
      - frontend-network
    restart: unless-stopped

  httpd:
    build: ./http-server
    ports:
      - "80:80"
    networks:
      - frontend-network
    depends_on:
      - backend
      - front
    restart: unless-stopped

networks:
  backend-network:
  frontend-network:

volumes:
  db-data:
